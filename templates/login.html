<!DOCTYPE html>
<html>
<head>
    <title>WhisperBox Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-container">

    <h1>WhisperBox</h1>

    <p class="subtitle">
        Secure Private Conversations
    </p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="switch-link">
        Don't have an account?
        <a href="/register">
            Register
        </a>
    </p>

</div>

</body>
</html>
